server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed asset filenames (e.g. index-AbC123.js), so they can
  # be cached forever — a new build produces new filenames.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html (and the SPA fallback) must always be revalidated, so a deploy's
  # new hashed bundles are picked up immediately — no stale UI after an update.
  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
