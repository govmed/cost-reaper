name: CI

# FE-3 quality gates: format → lint → typecheck → test → build (NFR-6).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: estimator
          POSTGRES_PASSWORD: estimator
          POSTGRES_DB: cost_reaper_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U estimator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://estimator:estimator@localhost:5432/cost_reaper_test?schema=public
      JWT_SECRET: ci_test_secret_value_at_least_32_chars_long
      JWT_REFRESH_SECRET: ci_test_refresh_secret_value_at_least_32_chars
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci_admin_password
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      # NFR-4: dependency vulnerability scan. Non-blocking on moderate for now.
      - run: pnpm audit --audit-level=high || true
