# cost-reaper stack — db / api / web  (FE-2, NFR-7).
# Bring up with `./scripts/start.sh` (or `start.ps1`). Config comes from `.env`.
services:
  db:
    image: postgres:16-alpine
    container_name: cost-reaper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cost-reaper-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: ${API_PORT:-8000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CLOUD_HOURS_PER_MONTH: ${CLOUD_HOURS_PER_MONTH:-730}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # Optional live cloud-pricing pull (FR-21a). Azure works without auth;
      # AWS needs keys, GCP needs an API key. Unset → falls back to the catalog.
      AZURE_RETAIL_PRICES_ENDPOINT: ${AZURE_RETAIL_PRICES_ENDPOINT:-https://prices.azure.com/api/retail/prices}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_PRICING_REGION: ${AWS_PRICING_REGION:-us-east-1}
      GCP_BILLING_API_KEY: ${GCP_BILLING_API_KEY:-}
      # Public, no-auth FX source for the FX-rates "Refresh" button (FR-17).
      FX_RATES_ENDPOINT: ${FX_RATES_ENDPOINT:-https://api.frankfurter.app/latest}
      # Single Sign-On (FR-26) — off unless configured. Pick ONE protocol.
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_PROTOCOL: ${SSO_PROTOCOL:-OIDC}
      SSO_DISPLAY_NAME: ${SSO_DISPLAY_NAME:-Company SSO}
      SSO_OIDC_ISSUER: ${SSO_OIDC_ISSUER:-}
      SSO_OIDC_CLIENT_ID: ${SSO_OIDC_CLIENT_ID:-}
      SSO_OIDC_CLIENT_SECRET: ${SSO_OIDC_CLIENT_SECRET:-}
      SSO_OIDC_REDIRECT_URI: ${SSO_OIDC_REDIRECT_URI:-http://localhost:8000/api/v1/auth/sso/callback}
      SSO_OIDC_SCOPES: ${SSO_OIDC_SCOPES:-openid email profile}
      SSO_SAML_ENTRY_POINT: ${SSO_SAML_ENTRY_POINT:-}
      SSO_SAML_ISSUER: ${SSO_SAML_ISSUER:-cost-reaper}
      SSO_SAML_CALLBACK_URL: ${SSO_SAML_CALLBACK_URL:-http://localhost:8000/api/v1/auth/sso/callback}
      SSO_SAML_IDP_CERT: ${SSO_SAML_IDP_CERT:-}
      SSO_SAML_ALLOW_UNVERIFIED: ${SSO_SAML_ALLOW_UNVERIFIED:-false}
      SSO_WSFED_LOGIN_URL: ${SSO_WSFED_LOGIN_URL:-}
      SSO_WSFED_REALM: ${SSO_WSFED_REALM:-cost-reaper}
      SSO_WSFED_REPLY_URL: ${SSO_WSFED_REPLY_URL:-http://localhost:8000/api/v1/auth/sso/callback}
      SSO_WSFED_IDP_CERT: ${SSO_WSFED_IDP_CERT:-}
      SSO_WSFED_ALLOW_UNVERIFIED: ${SSO_WSFED_ALLOW_UNVERIFIED:-false}
    ports:
      - '${API_PORT:-8000}:8000'
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:8000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: cost-reaper-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-5173}:80'

volumes:
  db_data:
